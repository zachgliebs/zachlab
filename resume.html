<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume | Zach Lieberman</title>
  <meta name="description" content="Resume of Zach Lieberman, mechanical engineering student and designer.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --steel-950: #0c1117;
      --steel-900: #141d28;
      --metal-strong: #dfe6ef;
      --bronze: #cb8d52;
      --line: rgba(255, 255, 255, 0.12);
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at top, rgba(203, 141, 82, 0.12), transparent 30%),
        linear-gradient(180deg, #0b1016 0%, #101922 100%);
      color: #edf2f7;
    }

    .navbar {
      background: rgba(10, 14, 20, 0.86) !important;
      backdrop-filter: blur(8px);
      border-color: var(--line) !important;
    }

    .resume-page {
      width: min(1120px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 4rem 0;
    }

    .resume-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .resume-heading h1 {
      margin: 0;
      font-size: clamp(2.2rem, 5vw, 4rem);
      letter-spacing: -0.04em;
    }

    .resume-heading p {
      margin: 0.65rem 0 0;
      color: rgba(237, 242, 247, 0.7);
    }

    .resume-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
    }

    .resume-actions a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.7rem 1rem;
      color: #edf2f7;
      text-decoration: none;
    }

    .resume-actions a:first-child {
      background: var(--bronze);
      border-color: var(--bronze);
      color: #101821;
      font-weight: 700;
    }

    .resume-viewer {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: rgba(17, 24, 30, 0.82);
      box-shadow: 0 18px 45px rgba(2, 4, 8, 0.35);
    }

    .resume-image {
      display: block;
      width: 65%;
      height: auto;
      max-width: 100%;
      margin: 0 auto;
    }

    @media (max-width: 640px) {
      .resume-page {
        padding: 2.5rem 0;
      }

      .resume-heading {
        align-items: start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-dark sticky-top border-bottom">
    <div class="container-fluid px-3 px-md-4">
      <a class="navbar-brand" href="index.html"><i class="bi bi-arrow-left me-2"></i>Zach Lieberman</a>
      <a class="nav-link text-light" href="index.html">Back to portfolio</a>
    </div>
  </nav>

  <main class="resume-page">
    <div class="resume-heading">
      <div>
        <h1>Resume</h1>
        <p>View my current resume below.</p>
      </div>
      <div class="resume-actions">
        <a href="media/Zach_s_Resume_1Page.pdf" target="_blank" rel="noopener"><i class="bi bi-box-arrow-up-right"></i>Open PDF</a>
        <a href="media/Zach_s_Resume_1Page.pdf" download><i class="bi bi-download"></i>Download</a>
      </div>
    </div>

    <div class="resume-viewer overflow-auto">
      <img class="resume-image" src="media/1_1.png" alt="Zach Lieberman's resume">
    </div>
  </main>
</body>

</html>
