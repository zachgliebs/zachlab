<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Zach Lieberman</title>
  <meta name="description" content="Project archive with category filters for Zach Lieberman's work.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --steel-950: #0c1117;
      --steel-900: #141d28;
      --steel-800: #1b2a36;
      --steel-700: #2c4052;
      --steel-500: #6d8197;
      --metal: #b7bfc7;
      --metal-strong: #dfe6ef;
      --bronze: #cb8d52;
      --line: rgba(255, 255, 255, 0.12);
      --shadow: rgba(2, 4, 8, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top, rgba(203, 141, 82, 0.12), transparent 30%),
        linear-gradient(180deg, #0b1016 0%, #101922 100%);
      color: #edf2f7;
      font-family: "Segoe UI", sans-serif;
    }

    a { text-decoration: none; }

    .container {
      width: min(1180px, calc(100% - 2rem));
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(10, 14, 20, 0.82);
      backdrop-filter: blur(8px);
    }

    .nav-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      min-height: 72px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      color: #edf2f7;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand i { color: #f3c899; }

    .nav-link {
      color: rgba(237, 242, 247, 0.8);
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.7rem 1rem;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .nav-link:hover {
      border-color: rgba(203, 141, 82, 0.45);
      transform: translateY(-1px);
      color: #edf2f7;
      text-decoration: none;
    }

    .page-shell {
      padding: 4rem 0 5rem;
    }

    .page-head {
      margin-bottom: 2rem;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.52rem 0.8rem;
      border-radius: 999px;
      border: 1px solid rgba(203, 141, 82, 0.45);
      background: rgba(203, 141, 82, 0.1);
      color: #f3c899;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.74rem;
      margin-bottom: 1rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 5vw, 4rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin: 2rem 0 2.25rem;
    }

    .filter-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(17, 24, 30, 0.8);
      color: #edf2f7;
      border-radius: 999px;
      padding: 0.7rem 1rem;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover,
    .filter-btn.active {
      border-color: rgba(203, 141, 82, 0.45);
      background: rgba(203, 141, 82, 0.12);
      color: #f3c899;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.25rem;
    }

    .project-card {
      position: relative;
      display: block;
      overflow: hidden;
      min-height: 360px;
      border-radius: 1.2rem;
      border: 1px solid var(--line);
      background: rgba(17, 24, 30, 0.9);
      box-shadow: 0 16px 30px rgba(0, 0, 0, 0.18);
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .project-card:hover {
      transform: translateY(-4px);
      border-color: rgba(203, 141, 82, 0.45);
    }

    .project-visual {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: transform 0.35s ease, filter 0.35s ease, opacity 0.35s ease;
      filter: saturate(0.85) contrast(1.02);
    }

    .project-card:hover .project-visual {
      transform: scale(1.05);
      filter: saturate(1) contrast(1.04);
    }

    .project-visual--1 { background-image: url('media/fullrobot-cycles.png'); }
    .project-visual--2 { background-image: url('media/scoreboard-1.png'); }
    .project-visual--3 { background-image: url('media/marqueeshowcase.png'); }
    .project-visual--4 { background-image: url('media/dsiPic.jpg'); }
    .project-visual--5 { background-image: url('media/PlowView.png'); }
    .project-visual--6 { background-image: url('media/ender3protext.jpg'); }

    .project-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 1.25rem;
      background: linear-gradient(180deg, rgba(8, 12, 18, 0.12), rgba(8, 12, 18, 0.82));
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .project-card:hover .project-overlay,
    .project-card:focus-visible .project-overlay {
      opacity: 1;
    }

    .project-overlay h3 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: -0.03em;
    }

    .project-category {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      width: fit-content;
      margin-top: 0.55rem;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      background: rgba(203, 141, 82, 0.14);
      border: 1px solid rgba(203, 141, 82, 0.35);
      color: #f3c899;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .project-card.hidden {
      display: none;
    }

    @media (max-width: 920px) {
      .project-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .project-grid {
        grid-template-columns: 1fr;
      }

      .nav-inner {
        padding: 0.7rem 0;
      }
    }
  </style>
</head>
<body>
  <nav class="topbar">
    <div class="container nav-inner">
      <a class="brand" href="index.html"><i class="bi bi-gear-fill"></i>Zach Lieberman</a>
      <a class="nav-link" href="index.html">Home</a>
    </div>
  </nav>

  <main class="page-shell">
    <div class="container">
      <div class="page-head">
        <span class="eyebrow"><i class="bi bi-folder2-open"></i> Project archive</span>
        <h1>Work across personal, school, and collaborative projects</h1>
      </div>

      <div class="filters" aria-label="Project filters">
        <button class="filter-btn active" type="button" data-filter="all">All</button>
        <button class="filter-btn" type="button" data-filter="personal">Personal</button>
        <button class="filter-btn" type="button" data-filter="school-project">School Project</button>
        <button class="filter-btn" type="button" data-filter="group-work">Group Work</button>
      </div>

      <div class="project-grid">
        <a class="project-card" href="proj1.html" data-category="group-work">
          <div class="project-visual project-visual--1"></div>
          <div class="project-overlay">
            <h3>FTC Robotics</h3>
            <span class="project-category">Group Work</span>
          </div>
        </a>


        <a class="project-card" href="proj2.html" data-category="personal">
          <div class="project-visual project-visual--2"></div>
          <div class="project-overlay">
            <h3>Scorescraper</h3>
            <span class="project-category">Personal</span>
          </div>
        </a>

        <a class="project-card" href="proj3.html" data-category="group-work">
          <div class="project-visual project-visual--3"></div>
          <div class="project-overlay">
            <h3>Marquee Sports Network Productions</h3>
            <span class="project-category">Group Work</span>
          </div>
        </a>

        <a class="project-card" href="proj4.html" data-category="group-work">
          <div class="project-visual project-visual--4"></div>
          <div class="project-overlay">
            <h3>DSI Productions</h3>
            <span class="project-category">Group Work </span>
          </div>
        </a>

        <a class="project-card" href="proj5.html" data-category="school-project">
          <div class="project-visual project-visual--5"></div>
          <div class="project-overlay">
            <h3>First Semester Robot Project</h3>
            <span class="project-category">School Project</span>
          </div>
        </a>

        <a class="project-card" href="proj6.html" data-category="personal">
          <div class="project-visual project-visual--6"></div>
          <div class="project-overlay">
            <h3>3D Printing Projects</h3>
            <span class="project-category">Personal</span>
          </div>
        </a>
      </div>
    </div>
  </main>

  <script>
    const filterButtons = document.querySelectorAll('.filter-btn');
    const projectCards = document.querySelectorAll('.project-card');

    filterButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const selected = button.dataset.filter;

        filterButtons.forEach((btn) => btn.classList.toggle('active', btn === button));

        projectCards.forEach((card) => {
          const matches = selected === 'all' || card.dataset.category === selected;
          card.classList.toggle('hidden', !matches);
        });
      });
    });
  </script>
</body>
</html>
